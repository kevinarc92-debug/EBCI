        <div class="bg-[#E8E8ED] p-1 rounded-xl flex items-center text-xs font-medium">
          <button type="button" id="tab-student" onclick="window.app && window.app.switchPortal('student')" class="px-4 py-1.5 rounded-lg transition-all duration-200 bg-white text-[#1D1D1F] shadow-sm font-semibold">Student Portal</button>

  <main id="app-viewport" class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8"></main>

  <!-- 全局 Apple 模态工作台 -->

    <div id="apple-modal-container" class="bg-white rounded-3xl shadow-2xl border border-black/[0.06] w-full max-w-5xl max-h-[90vh] flex flex-col overflow-hidden transform scale-95 transition-all duration-200">

        <div>
          <h3 id="modal-title" class="text-xl font-bold tracking-tight text-[#1D1D1F]">Title</h3>
          <p id="modal-subtitle" class="text-xs text-[#86868B] mt-0.5">Subtitle</p>
        </div>
        <button type="button" onclick="window.app.closeModal()" class="w-8 h-8 rounded-full bg-[#F5F5F7] hover:bg-[#E8E8ED] flex items-center justify-center text-[#86868B] hover:text-[#1D1D1F] transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>

      <div id="modal-body" class="px-6 sm:px-8 py-6 overflow-y-auto flex-1 space-y-6"></div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-16 opacity-0 transition-all duration-300 pointer-events-none px-5 py-3 rounded-2xl shadow-xl text-sm font-medium flex items-center space-x-2 text-white"></div>

  <script>
    /**
     * =========================================================================
     * 1. 专属 Supabase 云端对接凭据
     * =========================================================================
     */
    const SUPABASE_CONFIG = {
      url: 'https://kndzqhtqormzsbamaowh.supabase.co',
      anonKey: 'sb_publishable_qqBoF9WD9Asv0GDgmpDiNQ_PqTM9zBn'
    };

    let sbClient = null;
    try {
      if (window.supabase && window.supabase.createClient) {
        sbClient = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
      }
    } catch (e) {}

    const STORAGE_KEY = 'EBCI_APPLE_DB_V2';

    // 系统底层初始化兜底数据（仅保留一个可被自由修改的主管理员账号）
    const SEED_DATA = {
      teachers: [
        { 
          id: 't_admin', 
          username: 'admin', 
          password: 'ebci2026', 
          name: '主管理员', 
          is_admin: true, 
          assigned_classes: ['HSK1-A', 'BCT-B1'] 
        }
      ],
      classes: [
        { id: 'c_hsk1', code: 'HSK1-A', name: '商务汉语初级 A 班', teacher_id: 't_admin', created_at: '2026-09-01' },
        { id: 'c_bct_b1', code: 'BCT-B1', name: '商务汉语中级班', teacher_id: 't_admin', created_at: '2026-09-15' }
      ],
      students: [
        { id: 's_sophia', class_code: 'HSK1-A', name: 'Sophia', pin_code: '1234', created_at: '2026-10-01 10:00' }
      ],
      homeworks: [
        {
          id: 'hw_demo_1',
          class_code: 'HSK1-A',
          title: 'Lesson 1: Business Greetings & Character Tracing',
          deadline: '2026-11-30T23:59',
          hanzi_list: '你好谢谢',
          text_prompt: 'Please translate into Chinese:\n1. Nice to meet you, Mr. Wang.\n2. Thank you for your email.',
          require_audio: true,
          audio_prompt: 'Please read aloud with clear tones: "你好，很高兴认识您！谢谢您的合作。"',
          blocks: [
            { type: 'text', title: 'Business Etiquette Note', content: 'Exchanging name cards with both hands is customary in Chinese business.' }
          ],
          rich_note: 'Pay extra attention to stroke balance and steady pacing.',
          individual_overrides: {},
          created_at: '2026-10-02 09:30'
        }
      ],
      submissions: []
    };

    class EBCIApp {
      constructor() {
        this.currentPortal = 'teacher'; // 默认方便直接进入教师管理端测试
        this.currentStudent = null;
        this.currentTeacher = null;
        this.selectedTeacherClass = 'HSK1-A';
        this.teacherViewTab = 'homeworks';
        
        this.canvasEngines = {};
        this.mediaRecorder = null;
        this.recordedAudioBase64 = null;
        this.rawAudioBlob = null;
        this.recordingTimer = null;
        this.recordingSeconds = 0;
        this.tempAttachedName = '';
        this.isCloudOnline = false;

        this.init();
      }

      init() {
        this.ensureSeedData();
        // 瞬间渲染首屏，绝不卡死
        this.render();
        // 后台静默与云端同步
        setTimeout(() => this.backgroundSync(), 60);
      }

      ensureSeedData(forceReset = false) {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw || forceReset) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(SEED_DATA));
            return;
          }
          const parsed = JSON.parse(raw);
          if (!parsed.classes || !parsed.teachers || parsed.teachers.length === 0) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(SEED_DATA));
          }
        } catch (e) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(SEED_DATA));
        }
      }

      getDB() {
        this.ensureSeedData();
        return JSON.parse(localStorage.getItem(STORAGE_KEY));
      }

      saveDB(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      async backgroundSync() {
        if (!sbClient) return;
        try {
          const [tRes, cRes, sRes, hRes, subRes] = await Promise.all([
            sbClient.from('teachers').select('*'),
            sbClient.from('classes').select('*'),
            sbClient.from('students').select('*'),
            sbClient.from('homeworks').select('*'),
            sbClient.from('submissions').select('*')
          ]);

          if (cRes && cRes.data) {
            if (cRes.data.length === 0) {
              await this.seedCloudDatabase();
            } else {
              const cloudDB = {
                teachers: (tRes.data && tRes.data.length > 0) ? tRes.data : this.getDB().teachers,
                classes: cRes.data || [],
                students: sRes.data || [],
                homeworks: hRes.data || [],
                submissions: subRes.data || []
              };
              this.saveDB(cloudDB);
            }
            this.isCloudOnline = true;
          }
        } catch (e) {}
      }

      async seedCloudDatabase() {
        if (!sbClient) return;
        try {
          await sbClient.from('teachers').upsert(SEED_DATA.teachers);
          await sbClient.from('classes').upsert(SEED_DATA.classes);
          await sbClient.from('students').upsert(SEED_DATA.students);
          await sbClient.from('homeworks').upsert(SEED_DATA.homeworks);
        } catch (err) {}
      }

      async uploadFileToStorage(bucketName, filePath, blobOrBase64, contentType = 'application/octet-stream') {
        if (!sbClient) return (typeof blobOrBase64 === 'string' ? blobOrBase64 : '');
        try {
          let blob = blobOrBase64;
          if (typeof blobOrBase64 === 'string' && blobOrBase64.startsWith('data:')) {
            const arr = blobOrBase64.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) u8arr[n] = bstr.charCodeAt(n);
            blob = new Blob([u8arr], { type: mime });
          }

          const { error } = await sbClient.storage.from(bucketName).upload(filePath, blob, { contentType, upsert: true });
          if (error) throw error;

          const { data: publicUrlData } = sbClient.storage.from(bucketName).getPublicUrl(filePath);
          return publicUrlData.publicUrl;
        } catch (e) {
          return typeof blobOrBase64 === 'string' ? blobOrBase64 : '';
        }
      }

      async syncRecord(tableName, record) {
        const db = this.getDB();
        const list = db[tableName] || [];
        const idx = list.findIndex(item => item.id === record.id);
        if (idx >= 0) list[idx] = record;
        else list.unshift(record);
        db[tableName] = list;
        this.saveDB(db);

        if (sbClient) {
          try { await sbClient.from(tableName).upsert(record); } catch (e) {}
        }
      }

      showToast(msg, type = 'info') {
        const toast = document.getElementById('toast');
        toast.className = 'fixed bottom-6 right-6 z-50 transform transition-all duration-300 px-5 py-3 rounded-2xl shadow-xl text-sm font-medium flex items-center space-x-2 text-white pointer-events-auto ' + 
          (type === 'success' ? 'bg-[#34C759]' : type === 'error' ? 'bg-[#FF3B30]' : 'bg-[#1D1D1F]');
        toast.innerHTML = `<span>${msg}</span>`;
        toast.classList.remove('translate-y-16', 'opacity-0');
        setTimeout(() => toast.classList.add('translate-y-16', 'opacity-0'), 3000);
      }

      switchPortal(portal) {
        this.currentPortal = portal;
        document.getElementById('tab-student').className = portal === 'student' ? 'px-4 py-1.5 rounded-lg bg-white text-[#1D1D1F] shadow-sm font-semibold' : 'px-4 py-1.5 rounded-lg text-[#86868B]';
        document.getElementById('tab-teacher').className = portal === 'teacher' ? 'px-4 py-1.5 rounded-lg bg-white text-[#1D1D1F] shadow-sm font-semibold' : 'px-4 py-1.5 rounded-lg text-[#86868B]';
        this.render();
      }

      navHome() { this.render(); }

      render() {
        const viewport = document.getElementById('app-viewport');
        if (!viewport) return;
        if (this.currentPortal === 'student') {
          viewport.innerHTML = !this.currentStudent ? this.renderStudentLoginView() : this.renderStudentPortalView();
        } else {
          viewport.innerHTML = !this.currentTeacher ? this.renderTeacherLoginView() : this.renderTeacherAdminView();
        }
      }

      /* ==========================================================
       * 1. 教师端：超管中心与教师全动态 CRUD（主管理员专属特权）
       * ========================================================== */

      renderAdminTeamView() {

        const teachers = db.teachers || [];

        return `

            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-4 border-b border-black/[0.06]">
              <div>
                <h3 class="text-xl font-bold tracking-tight text-[#1D1D1F]">⚙️ 教师团队与系统权限中心</h3>
                <p class="text-xs text-[#86868B] mt-1">共 ${teachers.length} 位在册教师 • 主管理员可动态增改资料、重置密码及分配管辖班级</p>
              </div>

              <!-- 添加新教师按钮 -->
              <button type="button" onclick="window.app.openTeacherModal()" 
                class="px-4 py-2.5 bg-[#0071E3] hover:bg-[#0077ED] active:scale-95 text-white text-xs font-semibold rounded-xl shadow-md flex items-center space-x-1.5 transition-all shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                <span>+ 添加新教师</span>
              </button>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead>
                  <tr class="border-b border-black/[0.06] text-[#86868B]">
                    <th class="py-3 px-4 font-semibold">教师姓名</th>
                    <th class="py-3 px-4 font-semibold">登录账号</th>

                  </tr>
                </thead>

                  ${teachers.map(t => {

                        <td class="py-4 px-4">
                          <span class="px-2.5 py-1 rounded-full text-[10px] font-semibold ${t.is_admin ? 'bg-[#34C759]/15 text-[#34C759]' : 'bg-[#0071E3]/10 text-[#0071E3]'}">
                            ${t.is_admin ? '主管理员' : '任课教师'}
                          </span>
                        </td>
                        <td class="py-4 px-4 text-[#86868B]">

                            ${(t.assigned_classes && t.assigned_classes.length > 0) ? t.assigned_classes.map(c => `

                            `).join('') : '<span class="text-xs text-[#86868B]">全院所有班级</span>'}
                          </div>
                        </td>
                        <td class="py-4 px-4 text-right space-x-2 whitespace-nowrap">
                          <button type="button" onclick="window.app.openTeacherModal('${t.id}')" 
                            class="px-2.5 py-1 bg-[#0071E3]/10 hover:bg-[#0071E3]/20 active:scale-95 text-[#0071E3] font-semibold rounded-lg text-xs transition-all">
                            ✏️ 编辑资料
                          </button>
                          ${isSelf ? `

        `;
      }

      // 添加与编辑教师通用模态面板

        const teacher = teacherId ? db.teachers.find(t => t.id === teacherId) : null;

            </div>

              <label class="block text-xs font-bold text-[#86868B] uppercase tracking-wider mb-1.5">登录账号 (Username) *</label>

            </div>

            <div class="p-3 bg-[#F5F5F7] rounded-xl">
              <label class="flex items-center space-x-2 text-xs font-semibold text-[#1D1D1F] cursor-pointer">

      async saveTeacher(teacherId = '') {
        const name = document.getElementById('modal-tch-name').value.trim();
        const username = document.getElementById('modal-tch-username').value.trim();
        const pwd = document.getElementById('modal-tch-pwd').value.trim();
        const isAdmin = document.getElementById('modal-tch-isadmin').checked;

        const selectedCls = [];
        document.querySelectorAll('input[name="modal-assign-cls"]:checked').forEach(cb => selectedCls.push(cb.value));

        if (!name || !username || !pwd) {
          alert('请完整填写教师姓名、登录账号与密码！');
          return;
        }

        const db = this.getDB();

        if (teacherId) {
          // 编辑已有教师
          const teacher = db.teachers.find(t => t.id === teacherId);
          if (!teacher) return;
          
          // 如果修改了用户名，校验唯一性
          if (teacher.username !== username && db.teachers.some(t => t.username === username)) {
            alert('该登录账号已被其他教师占用，请更换！');
            return;
          }

          teacher.name = name;
          teacher.username = username;
          teacher.password = pwd;
          teacher.is_admin = isAdmin;
          teacher.assigned_classes = selectedCls;

          // 若当前登录者正是被修改者，同步更新会话
          if (this.currentTeacher && this.currentTeacher.id === teacher.id) {
            this.currentTeacher = { ...teacher };
          }

          await this.syncRecord('teachers', teacher);
          this.showToast(`教师 ${name} 的资料已更新！`, 'success');
        } else {
          // 添加新教师
          if (db.teachers.some(t => t.username === username)) {
            alert('该登录账号已被占用，请使用唯一账号！');
            return;
          }

          const newTeacher = {
            id: 't_' + Date.now(),
            username,
            password: pwd,
            name,
            is_admin: isAdmin,
            assigned_classes: selectedCls.length > 0 ? selectedCls : [db.classes[0]?.code || 'HSK1-A']
          };

          await this.syncRecord('teachers', newTeacher);
          this.showToast(`已成功添加教师：${name}！`, 'success');
        }

        this.closeModal();
        this.render();
      }

        if (this.currentTeacher && this.currentTeacher.id === id) {
          alert('操作拦截：禁止删除当前正在登录的自身账号！');
          return;
        }

        if (!confirm('确定要注销删除该教师账号吗？此操作不可逆。')) return;
        const db = this.getDB();
        db.teachers = db.teachers.filter(t => t.id !== id);
        this.saveDB(db);

        if (sbClient) {
          try { await sbClient.from('teachers').delete().eq('id', id); } catch (e) {}
        }
        this.showToast('已成功注销该教师账号', 'info');
        this.render();
      }

      async teacherLogin() {
        this.ensureSeedData();
        const u = (document.getElementById('tch-username')?.value || '').trim();
        const p = (document.getElementById('tch-password')?.value || '').trim();
        const alertBox = document.getElementById('teacher-login-alert');
        const alertMsg = document.getElementById('teacher-alert-msg');
        const btn = document.getElementById('btn-tch-login');

        if (!u || !p) {
          alertMsg.textContent = '请输入账号与密码。';
          alertBox.classList.remove('hidden');
          return;
        }

        btn.disabled = true;
        btn.textContent = '验证中...';

        let db = this.getDB();
        let teacher = db.teachers.find(t => t.username === u && t.password === p);

        // 云端穿透查询（确保新添加的教师在任何全新设备上均可立即登入）
        if (!teacher && sbClient) {
          try {
            const { data } = await sbClient.from('teachers').select('*').eq('username', u).eq('password', p).maybeSingle();
            if (data) {
              teacher = data;
              const idx = db.teachers.findIndex(t => t.id === data.id);
              if (idx >= 0) db.teachers[idx] = data;
              else db.teachers.push(data);
              this.saveDB(db);
            }
          } catch (e) {}
        }

        btn.disabled = false;
        btn.textContent = '进入教务后台';

        if (!teacher) {
          alertMsg.textContent = '账号或密码错误，请重试。';
          alertBox.classList.remove('hidden');
          return;
        }

        this.currentTeacher = teacher;
        const allowedClasses = teacher.is_admin ? db.classes.map(c => c.code) : (teacher.assigned_classes || []);
        this.selectedTeacherClass = allowedClasses[0] || db.classes[0]?.code || 'HSK1-A';
        this.teacherViewTab = 'homeworks';
        this.render();
      }

      initRiceGridCanvas(idx, char) {
        const canvas = document.getElementById(`hanzi-canvas-${idx}`);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const size = 200;
        canvas.width = size;
        canvas.height = size;

        const drawGrid = () => {
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, size, size);
          ctx.strokeStyle = 'rgba(255, 59, 48, 0.25)';
          ctx.lineWidth = 1;
          ctx.strokeRect(0.5, 0.5, size - 1, size - 1);
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(size / 2, 0); ctx.lineTo(size / 2, size);
          ctx.moveTo(0, size / 2); ctx.lineTo(size, size / 2);
          ctx.moveTo(0, 0); ctx.lineTo(size, size);
          ctx.moveTo(size, 0); ctx.lineTo(0, size);
          ctx.stroke();

          ctx.font = '130px "KaiTi", "STKaiti", serif';
          ctx.fillStyle = 'rgba(142, 142, 147, 0.3)';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(char, size / 2, size / 2 + 8);
        };
        drawGrid();

        const state = { canvas, ctx, isDrawing: false, drawGrid };
        this.canvasEngines[idx] = state;

        const startDraw = (e) => {
          e.preventDefault();
          state.isDrawing = true;
          const rect = canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          ctx.beginPath();
          ctx.moveTo((clientX - rect.left) * (canvas.width / rect.width), (clientY - rect.top) * (canvas.height / rect.height));
          ctx.strokeStyle = '#1D1D1F';
          ctx.lineWidth = 6;
          ctx.lineCap = 'round';
        };
        const drawMove = (e) => {
          if (!state.isDrawing) return;
          e.preventDefault();
          const rect = canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          ctx.lineTo((clientX - rect.left) * (canvas.width / rect.width), (clientY - rect.top) * (canvas.height / rect.height));
          ctx.stroke();
        };
        const endDraw = () => { if (state.isDrawing) state.isDrawing = false; };

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', drawMove);
        window.addEventListener('mouseup', endDraw);
        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', drawMove, { passive: false });
        canvas.addEventListener('touchend', endDraw);
      }

      clearCanvas(idx) {
        if (this.canvasEngines[idx]) this.canvasEngines[idx].drawGrid();
      }

      async toggleRecording() {
        const btnText = document.getElementById('record-btn-text');
        const iconDot = document.getElementById('record-icon-dot');
        const timerLabel = document.getElementById('recording-timer');
        const playbackContainer = document.getElementById('audio-playback-container');
        const audioPlayer = document.getElementById('student-audio-player');

        if (this.mediaRecorder && this.mediaRecorder.state === 'recording') {
          this.mediaRecorder.stop();
          clearInterval(this.recordingTimer);
          btnText.textContent = 'Record Again';
          iconDot.classList.remove('animate-recording');
          return;
        }

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder) {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' :
                             MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';
            this.mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
            
            const chunks = [];
            this.recordingSeconds = 0;
            this.mediaRecorder.ondataavailable = e => chunks.push(e.data);
            
            this.mediaRecorder.onstop = () => {
              const actualMime = this.mediaRecorder.mimeType || 'audio/webm';
              const blob = new Blob(chunks, { type: actualMime });
              this.rawAudioBlob = blob;

              const reader = new FileReader();
              reader.onloadend = () => {
                this.recordedAudioBase64 = reader.result;
                audioPlayer.src = this.recordedAudioBase64;
                playbackContainer.classList.remove('hidden');
              };
              reader.readAsDataURL(blob);
              stream.getTracks().forEach(t => t.stop());
            };

            this.mediaRecorder.start();
            btnText.textContent = 'Stop Recording';
            iconDot.classList.add('animate-recording');
            this.recordingTimer = setInterval(() => {
              this.recordingSeconds++;
              timerLabel.textContent = `${String(Math.floor(this.recordingSeconds / 60)).padStart(2, '0')}:${String(this.recordingSeconds % 60).padStart(2, '0')}`;
            }, 1000);
            return;
          } catch (err) {}
        }

        btnText.textContent = 'Recording (Simulated)...';
        iconDot.classList.add('animate-recording');
        this.recordingSeconds = 0;
        this.recordingTimer = setInterval(() => {
          this.recordingSeconds++;
          timerLabel.textContent = `00:0${this.recordingSeconds}`;
          if (this.recordingSeconds >= 3) {
            clearInterval(this.recordingTimer);
            btnText.textContent = 'Record Again';
            iconDot.classList.remove('animate-recording');
            this.recordedAudioBase64 = this.generateSampleWavBase64();
            audioPlayer.src = this.recordedAudioBase64;
            playbackContainer.classList.remove('hidden');
            this.showToast('Sample audio recorded.', 'info');
          }
        }, 1000);
      }

      generateSampleWavBase64() {
        const sampleRate = 8000;
        const numSamples = sampleRate * 1.5;
        const buffer = new ArrayBuffer(44 + numSamples);
        const view = new DataView(buffer);
        const writeString = (offset, str) => {
          for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
        };
        writeString(0, 'RIFF');
        view.setUint32(4, 36 + numSamples, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate, true);
        view.setUint16(32, 1, true);
        view.setUint16(34, 8, true);
        writeString(36, 'data');
        view.setUint32(40, numSamples, true);
        for (let i = 0; i < numSamples; i++) {
          view.setUint8(44 + i, Math.floor(128 + 100 * Math.sin((i / sampleRate) * 440 * 2 * Math.PI)));
        }
        let binary = '';
        const bytes = new Uint8Array(buffer);
        for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
        return 'data:audio/wav;base64,' + btoa(binary);
      }

      async submitStudentHomework(hwId) {
        const submitBtn = document.getElementById('btn-submit-hw');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving...';

        const db = this.getDB();
        const studentName = this.currentStudent.name;
        const textAnswer = document.getElementById('stu-text-answer')?.value || '';

        const snapshotsUrls = [];
        const canvasKeys = Object.keys(this.canvasEngines);
        for (let i = 0; i < canvasKeys.length; i++) {
          const idx = canvasKeys[i];
          const base64 = this.canvasEngines[idx].canvas.toDataURL('image/png');
          const uploadedUrl = await this.uploadFileToStorage('ebci-homework-attachments', `hanzi_${hwId}_${studentName}_${idx}_${Date.now()}.png`, base64, 'image/png');
          snapshotsUrls.push(uploadedUrl || base64);
        }

        let safeAudioData = this.recordedAudioBase64 || '';
        if (this.rawAudioBlob && sbClient) {
          const mime = this.rawAudioBlob.type || 'audio/webm';
          const ext = mime.includes('mp4') ? 'mp4' : 'webm';
          const cloudAudioUrl = await this.uploadFileToStorage('ebci-student-audio', `audio_${hwId}_${studentName}_${Date.now()}.${ext}`, this.rawAudioBlob, mime);
          if (cloudAudioUrl && cloudAudioUrl.startsWith('http')) {
            safeAudioData = cloudAudioUrl;
          }
        }

        let subIndex = db.submissions.findIndex(s => s.homework_id === hwId && s.student_name.toLowerCase() === studentName.toLowerCase());
        const subData = {
          id: subIndex >= 0 ? db.submissions[subIndex].id : 'sub_' + Date.now(),
          homework_id: hwId,
          student_name: studentName,
          class_code: this.currentStudent.class_code,
          text_answer: textAnswer,
          hanzi_snapshots: snapshotsUrls.length > 0 ? snapshotsUrls : (subIndex >= 0 ? db.submissions[subIndex].hanzi_snapshots : []),
          audio_data: safeAudioData,
          audio_duration: '00:08',
          grade: subIndex >= 0 ? db.submissions[subIndex].grade : '',
          feedback: subIndex >= 0 ? db.submissions[subIndex].feedback : '',
          submitted_at: new Date().toISOString().replace('T', ' ').substring(0, 16),
          graded_at: subIndex >= 0 ? db.submissions[subIndex].graded_at : ''
        };

        await this.syncRecord('submissions', subData);
        this.closeModal();
        this.showToast('Assignment submitted successfully!', 'success');
        this.render();
      }
    }
