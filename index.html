            localStorage.setItem(STORAGE_KEY, JSON.stringify(SEED_DATA));
            return;
          }
          const parsed = JSON.parse(raw);
          if (!parsed.classes || !parsed.teachers || parsed.teachers.length === 0) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(SEED_DATA));
          }
        } catch (e) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(SEED_DATA));
        }
      }

      getDB() {
        this.ensureSeedData();
        return JSON.parse(localStorage.getItem(STORAGE_KEY));
      }

      saveDB(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      async backgroundSync() {
        if (!sbClient) return;
        try {
          const [tRes, cRes, sRes, hRes, subRes] = await Promise.all([
            sbClient.from('teachers').select('*'),
            sbClient.from('classes').select('*'),
            sbClient.from('students').select('*'),
            sbClient.from('homeworks').select('*'),
            sbClient.from('submissions').select('*')
          ]);

          if (cRes && cRes.data) {
            if (cRes.data.length === 0) {
              await this.seedCloudDatabase();
            } else {
              const cloudDB = {
                teachers: (tRes.data && tRes.data.length > 0) ? tRes.data : this.getDB().teachers,
                classes: cRes.data || [],
                students: sRes.data || [],
                homeworks: hRes.data || [],
                submissions: subRes.data || []
              };
              this.saveDB(cloudDB);
            }
          }
        } catch (e) {}
      }

      async seedCloudDatabase() {
        if (!sbClient) return;
        try {
          await sbClient.from('teachers').upsert(SEED_DATA.teachers);
          await sbClient.from('classes').upsert(SEED_DATA.classes);
          await sbClient.from('students').upsert(SEED_DATA.students);
          await sbClient.from('homeworks').upsert(SEED_DATA.homeworks);
        } catch (err) {}
      }

      async uploadFileToStorage(bucketName, filePath, blobOrBase64, contentType = 'application/octet-stream') {
        if (!sbClient) return (typeof blobOrBase64 === 'string' ? blobOrBase64 : '');
        try {
          let blob = blobOrBase64;
          if (typeof blobOrBase64 === 'string' && blobOrBase64.startsWith('data:')) {
            const arr = blobOrBase64.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) u8arr[n] = bstr.charCodeAt(n);
            blob = new Blob([u8arr], { type: mime });
          }

          const { error } = await sbClient.storage.from(bucketName).upload(filePath, blob, { contentType, upsert: true });
          if (error) throw error;

          const { data: publicUrlData } = sbClient.storage.from(bucketName).getPublicUrl(filePath);
          return publicUrlData.publicUrl;
        } catch (e) {
          return typeof blobOrBase64 === 'string' ? blobOrBase64 : '';
        }
      }

      async syncRecord(tableName, record) {
        const db = this.getDB();
        const list = db[tableName] || [];
        const idx = list.findIndex(item => item.id === record.id);
        if (idx >= 0) list[idx] = record;
        else list.unshift(record);
        db[tableName] = list;
        this.saveDB(db);

        if (sbClient) {
          try { await sbClient.from(tableName).upsert(record); } catch (e) {}
        }
      }

      getPinyin(text) {

        return '';

        try {
          const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=zh|en`);
          const json = await res.json();
          if (json && json.responseData && json.responseData.translatedText) {
            return json.responseData.translatedText;
          }
        } catch (e) {}
        return 'Vocabulary Definition';

        toast.classList.remove('translate-y-16', 'opacity-0');
        setTimeout(() => toast.classList.add('translate-y-16', 'opacity-0'), 3000);

      async parseFlashcardsInput() {
        const input = document.getElementById('wiz-fc-input');
        if (input) this.wizardState.flashcardsText = input.value;
        const words = (this.wizardState.flashcardsText || '').split(/[,，\s]+/).filter(Boolean);
        
        const previewGrid = document.getElementById('wiz-fc-preview-grid');
        if (previewGrid) {
          previewGrid.innerHTML = '<div class="col-span-3 text-xs text-[#0071E3] animate-pulse">正在智能解析拼音与中英释义...</div>';
        }

        const list = [];
        for (const w of words) {
          const pinyin = this.getPinyin(w) || '';
          let meaning = DICTIONARY_MAP[w];
          if (!meaning) {
            meaning = await this.fetchOnlineTranslationFallback(w);
          }
          list.push({ hanzi: w, pinyin, meaning });
        }
        this.wizardState.flashcardsList = list;

        if (!previewGrid) return;
        previewGrid.innerHTML = this.wizardState.flashcardsList.map((fc, i) => `
          <div class="p-2.5 bg-[#F5F5F7] rounded-xl text-xs space-y-1">
            <div class="font-kaiti font-bold text-sm text-[#1D1D1F]">${fc.hanzi}</div>
            <input type="text" value="${fc.pinyin}" onchange="window.app.wizardState.flashcardsList[${i}].pinyin = this.value" class="w-full px-2 py-0.5 bg-white rounded border text-[11px] font-mono">
            <input type="text" value="${fc.meaning}" onchange="window.app.wizardState.flashcardsList[${i}].meaning = this.value" class="w-full px-2 py-0.5 bg-white rounded border text-[11px]">
          </div>
        `).join('');
      }

      previewHanziSplit(val) {
        this.wizardState.tracingText = val;
        const tags = document.getElementById('hanzi-preview-tags');
        if (!tags) return;
        const chars = (val || '').replace(/\s+/g, '').split('');
        tags.innerHTML = chars.map(c => `
          <span class="px-3 py-1.5 bg-white border border-black/[0.1] rounded-xl text-sm font-kaiti font-bold text-[#1D1D1F] shadow-sm flex items-center space-x-1.5">
            <span>${c}</span>

          </span>
        `).join('');
      }

          return `

              class="px-3 py-1.5 rounded-xl text-xs font-medium transition-all ${
                isBlank 
                  ? 'border-2 border-dashed border-[#0071E3] bg-[#0071E3]/10 text-[#0071E3] font-bold' 
                  : 'bg-white border border-black/[0.1] text-[#1D1D1F] hover:bg-black/5'
              }">
              ${isBlank ? `[ ___ ${token} ___ ]` : token}
            </button>
          `;
        }).join('');
      }

      initCalligraphyCanvas(idx, char) {
        const canvas = document.getElementById(`hanzi-canvas-${idx}`);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const size = 200;
        canvas.width = size;
        canvas.height = size;

        const drawRiceGrid = () => {
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, size, size);
          ctx.save();
          ctx.strokeStyle = 'rgba(255, 59, 48, 0.22)';
          ctx.lineWidth = 1;
          ctx.strokeRect(0.5, 0.5, size - 1, size - 1);
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(size / 2, 0); ctx.lineTo(size / 2, size);
          ctx.moveTo(0, size / 2); ctx.lineTo(size, size / 2);
          ctx.moveTo(0, 0); ctx.lineTo(size, size);
          ctx.moveTo(size, 0); ctx.lineTo(0, size);
          ctx.stroke();
          ctx.restore();
        };

        drawRiceGrid();

        let isDrawing = false;
        let lastPoint = null;
        let lastTime = 0;
        let currentStroke = [];
        const strokesHistory = [];

        const state = {
          canvas, ctx,
          drawRiceGrid,
          strokesHistory,
          undo() {
            if (strokesHistory.length === 0) return;
            strokesHistory.pop();
            this.redrawAll();
          },
          redrawAll() {
            drawRiceGrid();
            strokesHistory.forEach(stroke => {
              for (let i = 1; i < stroke.length; i++) {
                const p1 = stroke[i - 1];
                const p2 = stroke[i];
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = '#1D1D1F';
                ctx.lineWidth = p2.width;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
              }
            });
            // 实时同步快照至内存草稿池
            window.app.studentTracingDrafts[idx] = canvas.toDataURL('image/png');
          }
        };

        this.canvasEngines[idx] = state;

        // 如果之前已经书写过，自动回显笔迹
        if (this.studentTracingDrafts[idx]) {
          const cached = new Image();
          cached.onload = () => { ctx.drawImage(cached, 0, 0, size, size); };
          cached.src = this.studentTracingDrafts[idx];
        }

        const getPos = (e) => {
          const rect = canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height),
            time: Date.now()
          };
        };

        const onStart = (e) => {
          e.preventDefault();
          isDrawing = true;
          lastPoint = getPos(e);
          lastTime = lastPoint.time;
          currentStroke = [{ x: lastPoint.x, y: lastPoint.y, width: 6 }];
        };

        const onMove = (e) => {
          if (!isDrawing) return;
          e.preventDefault();
          const point = getPos(e);
          const dist = Math.hypot(point.x - lastPoint.x, point.y - lastPoint.y);
          const timeDiff = Math.max(point.time - lastTime, 1);
          const velocity = dist / timeDiff;

          const targetWidth = Math.max(3.5, Math.min(8.5, 9 - velocity * 3.5));
          const strokeWidth = (lastPoint.width || 6) * 0.6 + targetWidth * 0.4;

          ctx.beginPath();
          ctx.moveTo(lastPoint.x, lastPoint.y);
          ctx.lineTo(point.x, point.y);
          ctx.strokeStyle = '#1D1D1F';
          ctx.lineWidth = strokeWidth;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.stroke();

          point.width = strokeWidth;
          currentStroke.push(point);
          lastPoint = point;
          lastTime = point.time;
        };

        const onEnd = () => {
          if (isDrawing) {
            isDrawing = false;
            if (currentStroke.length > 0) {
              strokesHistory.push([...currentStroke]);
              currentStroke = [];
              // 笔画结束自动缓存
              window.app.studentTracingDrafts[idx] = canvas.toDataURL('image/png');
            }
          }
        };

        canvas.addEventListener('mousedown', onStart);
        canvas.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        canvas.addEventListener('touchstart', onStart, { passive: false });
        canvas.addEventListener('touchmove', onMove, { passive: false });
        canvas.addEventListener('touchend', onEnd);

        try {
          const animContainer = document.getElementById(`hanzi-anim-${idx}`);
          if (animContainer && window.HanziWriter) {
            animContainer.innerHTML = '';
            this.hanziWriters[idx] = HanziWriter.create(animContainer, char, {
              width: 120,
              height: 120,
              padding: 5,
              showOutline: true,
              strokeColor: '#0071E3',
              outlineColor: 'rgba(0,0,0,0.1)'
            });
          }
        } catch (err) {}
      }

      animateHanziStroke(idx) {
        if (this.hanziWriters[idx]) {
          this.hanziWriters[idx].animateCharacter();
        }
      }

      speakWord(text) {
        try {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'zh-CN';
          u.rate = 0.85;
          window.speechSynthesis.speak(u);
        } catch (e) {}
      }

      undoStroke(idx) {
        if (this.canvasEngines[idx]) this.canvasEngines[idx].undo();
      }

      clearCanvas(idx) {
        if (this.canvasEngines[idx]) {
          this.canvasEngines[idx].strokesHistory.length = 0;
          this.canvasEngines[idx].drawRiceGrid();
          delete this.studentTracingDrafts[idx];
        }
      }

        const sub = db.submissions.find(s => s.id === submissionId);
        if (!sub) return;

        const hw = db.homeworks.find(h => h.id === sub.homework_id);

        const modalOverlay = document.getElementById('apple-modal-overlay');

        document.getElementById('modal-subtitle').textContent = `作业：${hw ? hw.title : '未知'} • 提交时间：${sub.submitted_at || '未记录'}`;

        this.renderGradeModalContent();

      renderGradeHanziGridSection(hw, sub) {
        const snapshots = sub.hanzi_snapshots || [];
        const chars = (hw?.hanzi_list || '').split('');
        const totalChars = Math.max(snapshots.length, chars.length);

        if (totalChars === 0) {
          return '<div class="p-4 bg-[#F5F5F7] rounded-2xl text-xs text-[#86868B]">本次作业无汉字临摹任务或暂无手写快照。</div>';
        }

        const pageSize = this.gradingPageSize;
        const totalPages = Math.ceil(totalChars / pageSize);
        const startIndex = (this.gradingCharPage - 1) * pageSize;
        const currentBatch = [];

        for (let i = startIndex; i < Math.min(startIndex + pageSize, totalChars); i++) {
          currentBatch.push({
            index: i,
            char: chars[i] || '字',
            pinyin: this.getPinyin(chars[i] || ''),
            snapshotUrl: snapshots[i] || null
          });
        }

        return `
          <div class="p-5 bg-white border border-black/[0.08] rounded-3xl space-y-4 shadow-sm">
            <div class="flex items-center justify-between">
              <div>
                <h5 class="text-xs font-bold text-[#E02020] uppercase tracking-wider flex items-center space-x-1.5">
                  <span>🖊️ 教师红笔批注与印章系统 (3 列并联批阅)</span>
                </h5>
                <p class="text-[11px] text-[#86868B] mt-0.5">直接在下方画布圈改，支持为每个单字独立加盖方印</p>
              </div>
              <span class="text-xs text-[#0071E3] font-semibold">共 ${totalChars} 个汉字</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
              ${currentBatch.map(item => `
                <div class="p-3.5 bg-[#F5F5F7] rounded-2xl flex flex-col items-center space-y-3 border border-black/[0.04]">
                  <div class="w-full flex items-center justify-between text-xs px-1">
                    <span class="font-bold text-[#1D1D1F]">${item.index + 1}. <strong class="text-sm font-kaiti">${item.char}</strong></span>
                    <span class="text-[#0071E3] font-mono text-[11px]">${item.pinyin}</span>
                  </div>

                  <div class="relative w-[180px] h-[180px] rounded-xl overflow-hidden border border-black/[0.1] bg-white shadow-inner">
                    ${item.snapshotUrl ? `
                      <img src="${item.snapshotUrl}" class="absolute inset-0 w-full h-full object-contain pointer-events-none" />
                    ` : `
                      <div class="absolute inset-0 flex items-center justify-center text-xs text-[#86868B]">未检测到书写快照</div>
                    `}
                    <canvas id="grade-red-canvas-${item.index}" width="180" height="180" class="absolute inset-0 z-10 drawing-canvas"></canvas>
                  </div>

                  <div class="flex items-center space-x-1 pt-1">
                    <button type="button" onclick="window.app.addSealToCharCanvas(${item.index}, '优秀')" class="px-2 py-0.5 text-[11px] rounded bg-red-50 text-[#E02020] font-bold border border-[#E02020]/20 hover:bg-red-100">
                      印章【优】
                    </button>
                    <button type="button" onclick="window.app.addSealToCharCanvas(${item.index}, '阅')" class="px-2 py-0.5 text-[11px] rounded bg-red-50 text-[#E02020] font-bold border border-[#E02020]/20 hover:bg-red-100">
                      印章【阅】
                    </button>
                    <button type="button" onclick="window.app.clearSingleCharRedPen(${item.index})" class="px-1.5 py-0.5 text-[10px] text-[#86868B] hover:text-[#FF3B30]">
                      清空
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>

            ${totalPages > 1 ? `
              <div class="pt-3 border-t border-black/[0.06] flex items-center justify-between text-xs">
                <button type="button" onclick="window.app.stepGradingCharPage(-1)" ${this.gradingCharPage <= 1 ? 'disabled class="text-black/20 cursor-not-allowed"' : 'class="font-semibold text-[#0071E3] hover:underline"'}>
                  ◀ 上一页
                </button>
                <span class="text-[#86868B] font-mono">
                  第 ${this.gradingCharPage} / ${totalPages} 页 (第 ${startIndex + 1} - ${Math.min(startIndex + pageSize, totalChars)} 字 / 共 ${totalChars} 字)
                </span>
                <button type="button" onclick="window.app.stepGradingCharPage(1)" ${this.gradingCharPage >= totalPages ? 'disabled class="text-black/20 cursor-not-allowed"' : 'class="font-semibold text-[#0071E3] hover:underline"'}>
                  下一页 ▶
                </button>
              </div>
            ` : ''}
          </div>

      mountGradingCanvasesForCurrentPage() {
        const pageSize = this.gradingPageSize;
        const startIndex = (this.gradingCharPage - 1) * pageSize;

        for (let i = startIndex; i < startIndex + pageSize; i++) {
          const canvas = document.getElementById(`grade-red-canvas-${i}`);
          if (!canvas) continue;
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (this.gradingAnnotations[i]) {
            const cachedImg = new Image();
            cachedImg.onload = () => { ctx.drawImage(cachedImg, 0, 0, canvas.width, canvas.height); };
            cachedImg.src = this.gradingAnnotations[i];
          }

          let isDown = false;
          const getPos = (e) => {
            const rect = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return {
              x: (cx - rect.left) * (canvas.width / rect.width),
              y: (cy - rect.top) * (canvas.height / rect.height)
            };
          };

          const onDown = (e) => {
            e.preventDefault();
            isDown = true;
            const p = getPos(e);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.strokeStyle = '#E02020';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
          };

          const onMove = (e) => {
            if (!isDown) return;
            e.preventDefault();
            const p = getPos(e);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
          };

          const onUp = () => {
            if (isDown) {
              isDown = false;
              this.gradingAnnotations[i] = canvas.toDataURL('image/png');
            }
          };

          canvas.addEventListener('mousedown', onDown);
          canvas.addEventListener('mousemove', onMove);
          window.addEventListener('mouseup', onUp);
          canvas.addEventListener('touchstart', onDown, { passive: false });
          canvas.addEventListener('touchmove', onMove, { passive: false });
          canvas.addEventListener('touchend', onUp);
        }
      }

      cacheCurrentPageAnnotations() {
        const pageSize = this.gradingPageSize;
        const startIndex = (this.gradingCharPage - 1) * pageSize;
        for (let i = startIndex; i < startIndex + pageSize; i++) {
          const canvas = document.getElementById(`grade-red-canvas-${i}`);
          if (canvas) {
            this.gradingAnnotations[i] = canvas.toDataURL('image/png');
          }
        }
      }

      stepGradingCharPage(delta) {
        this.cacheCurrentPageAnnotations();
        this.gradingCharPage += delta;
        const db = this.getDB();
        const sub = db.submissions.find(s => s.id === this.gradingSubmissionId);
        const hw = db.homeworks.find(h => h.id === sub?.homework_id);
        const sec = document.getElementById('grade-hanzi-section');
        if (sec && sub) {
          sec.innerHTML = this.renderGradeHanziGridSection(hw, sub);
          this.mountGradingCanvasesForCurrentPage();
        }
      }

      addSealToCharCanvas(charIndex, sealText = '优秀') {
        const canvas = document.getElementById(`grade-red-canvas-${charIndex}`);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.save();
        ctx.translate(canvas.width - 35, 30);
        ctx.rotate(-8 * Math.PI / 180);
        ctx.strokeStyle = '#E02020';
        ctx.lineWidth = 2.2;
        ctx.strokeRect(-20, -12, 40, 24);
        ctx.font = 'bold 13px "KaiTi", "STKaiti", serif';
        ctx.fillStyle = '#E02020';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(sealText, 0, 1);
        ctx.restore();
        this.gradingAnnotations[charIndex] = canvas.toDataURL('image/png');
        this.showToast(`单字 #${charIndex + 1} 已加盖【${sealText}】印章！`, 'success');
      }

      clearSingleCharRedPen(charIndex) {
        const canvas = document.getElementById(`grade-red-canvas-${charIndex}`);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        delete this.gradingAnnotations[charIndex];
      }

      async mergeAllCharFeedbacks(sub, hw) {
        this.cacheCurrentPageAnnotations();
        const snapshots = sub.hanzi_snapshots || [];
        const chars = (hw?.hanzi_list || '').split('');
        const total = Math.max(snapshots.length, chars.length);
        const feedbackImages = [];

        for (let i = 0; i < total; i++) {
          const baseSnapshot = snapshots[i];
          const redLayerData = this.gradingAnnotations[i];

          if (!baseSnapshot && !redLayerData) {
            continue;
          }

          const merged = await new Promise((resolve) => {
            const offCanvas = document.createElement('canvas');
            offCanvas.width = 200;
            offCanvas.height = 200;
            const offCtx = offCanvas.getContext('2d');

            const drawBase = () => {
              if (baseSnapshot) {
                const img1 = new Image();
                img1.crossOrigin = 'anonymous';
                img1.onload = () => {
                  offCtx.drawImage(img1, 0, 0, 200, 200);
                  drawRed();
                };
                img1.onerror = () => drawRed();
                img1.src = baseSnapshot;
              } else {
                offCtx.fillStyle = '#FFFFFF';
                offCtx.fillRect(0, 0, 200, 200);
                drawRed();
              }
            };

            const drawRed = () => {
              if (redLayerData) {
                const img2 = new Image();
                img2.onload = () => {
                  offCtx.drawImage(img2, 0, 0, 200, 200);
                  resolve(offCanvas.toDataURL('image/png'));
                };
                img2.onerror = () => resolve(offCanvas.toDataURL('image/png'));
                img2.src = redLayerData;
              } else {
                resolve(offCanvas.toDataURL('image/png'));
              }
            };

            drawBase();
          });

          feedbackImages.push(merged);
        }

        return feedbackImages;
      }

      async saveAnnotationAndGrade(subId) {
        const db = this.getDB();
        const sub = db.submissions.find(s => s.id === subId);
        if (!sub) return;
        const hw = db.homeworks.find(h => h.id === sub.homework_id);

        this.showToast('正在批量合成所有汉字红笔印章回执...', 'info');

        const mergedFeedbacks = await this.mergeAllCharFeedbacks(sub, hw);
        sub.tracing_feedback_images = mergedFeedbacks;
        sub.tracing_feedback_image = mergedFeedbacks[0] || null;

        sub.grade = document.getElementById('grade-select')?.value || 'A (95)';
        sub.feedback = document.getElementById('feedback-input')?.value.trim() || '';
        sub.graded_at = new Date().toISOString().replace('T', ' ').substring(0, 16);

        await this.syncRecord('submissions', sub);
        this.closeModal();
        this.showToast('批改回执已成功存盘同步！', 'success');
        this.render();
      }

      openStudentHomeworkModal(hwId) {
        const db = this.getDB();

        if (!hw) return;

        const studentName = this.currentStudent.name;
        const sub = (db.submissions || []).find(s => s.homework_id === hwId && s.student_name.toLowerCase() === studentName.toLowerCase());

        // 如果作业已归档且学生未提交过，拦截进入
        if (hw.status === 'closed' && !sub) {
          return alert('该作业已关闭截止 (Closed)，当前无法进入答题。');
        }

        this.canvasEngines = {};
        this.hanziWriters = {};
        this.recordedAudioBase64 = sub?.audio_url || sub?.audio_data || null;
        this.rawAudioBlob = null;
        this.isRecording = false;
        this.dialogueAudios = sub?.dialogue_answers?.audios || {};
        this.completedStudentModules = [];
        this.studentReviewCharPage = 1;

        this.studentDraftAnswers = {

        if (hw.unscramble_data && hw.unscramble_data.tokens) {

          this.unscrambleUserTokens = sub?.unscramble_answers ? [...sub.unscramble_answers] : [];

                    <button type="button" onclick="window.app.exportStudentReportPDF('${sub.id}')" class="px-3 py-1 bg-white text-[#1D1D1F] border rounded-full text-xs font-bold shadow-sm">
                      🖨️ 导出 PDF
                    </button>
                    <span class="px-3 py-1 rounded-full text-xs font-bold bg-[#34C759] text-white shadow-sm">${sub.grade}</span>
                  </div>
                </div>
                <p class="text-xs text-[#1D1D1F] italic leading-relaxed">"${sub.feedback || 'Excellent work!'}"</p>
              </div>
            ` : ''}

            <div id="active-module-container" class="space-y-6">
              ${this.renderActiveStudentModuleContent(hw, sub)}
            </div>

            <div class="pt-6 border-t border-black/[0.06] flex items-center justify-between">
              <button type="button" onclick="window.app.stepPillModule('${hw.id}', -1)" class="px-4 py-2 bg-[#F5F5F7] hover:bg-[#E8E8ED] text-xs font-semibold rounded-xl text-[#86868B]">
                ← Previous
              </button>
              <div class="space-x-3">
                ${this.isLastModule(hw) ? `
                  <button type="button" onclick="window.app.showCelebrationModal('${hw.id}')" class="px-6 py-2.5 bg-[#34C759] hover:bg-[#30B753] text-white text-xs font-bold rounded-xl shadow-md transition-all">
                    ✓ Submit All Assignments (交卷)
                  </button>
                ` : `
                  <button type="button" onclick="window.app.stepPillModule('${hw.id}', 1)" class="px-6 py-2.5 bg-[#0071E3] hover:bg-[#0077ED] text-white text-xs font-semibold rounded-xl shadow-md transition-all">
                    Next Task ➔
                  </button>
                `}
              </div>
            </div>
          </div>
        `;

        if (this.activeStudentModule === 'tracing' && hw.hanzi_list && !sub?.tracing_feedback_images?.length) {
          setTimeout(() => {
            (hw.hanzi_list || '').split('').forEach((c, i) => this.initCalligraphyCanvas(i, c));
          }, 40);
        }
        if (this.activeStudentModule === 'speaking') {
          this.renderVoiceWidget();
        }
      }

      switchStudentPillModule(hwId, modKey) {
        this.collectCurrentModuleInputs();
        this.activeStudentModule = modKey;
        const db = this.getDB();
        const hw = db.homeworks.find(h => h.id === hwId);
        const sub = (db.submissions || []).find(s => s.homework_id === hwId && s.student_name.toLowerCase() === this.currentStudent.name.toLowerCase());
        this.renderStudentPillFlowWorkspace(hw, sub);
      }

      stepPillModule(hwId, delta) {
        this.collectCurrentModuleInputs();
        const db = this.getDB();
        const hw = db.homeworks.find(h => h.id === hwId);
        const mods = hw.selected_modules || [];
        const curIdx = mods.indexOf(this.activeStudentModule);
        const nextIdx = curIdx + delta;

        if (!this.completedStudentModules.includes(this.activeStudentModule)) {
          this.completedStudentModules.push(this.activeStudentModule);
        }

        if (nextIdx >= 0 && nextIdx < mods.length) {
          this.activeStudentModule = mods[nextIdx];
          const sub = (db.submissions || []).find(s => s.homework_id === hwId && s.student_name.toLowerCase() === this.currentStudent.name.toLowerCase());
          this.renderStudentPillFlowWorkspace(hw, sub);
        }
      }

      isLastModule(hw) {
        const mods = hw.selected_modules || [];
        return this.activeStudentModule === mods[mods.length - 1];
      }

      renderActiveStudentModuleContent(hw, sub) {
        const mod = this.activeStudentModule;
        switch (mod) {
          case 'flashcards': return this.renderStudentFlashcards(hw);
          case 'tracing': return this.renderStudentTracing(hw, sub);
          case 'unscramble': return this.renderStudentUnscramble(hw, sub);
          case 'cloze': return this.renderStudentCloze(hw, sub);
          case 'translation': return this.renderStudentTranslation(hw, sub);
          case 'dialogue': return this.renderStudentDialogue(hw, sub);
          case 'essay': return this.renderStudentEssay(hw, sub);
          case 'speaking': return this.renderStudentSpeaking(hw, sub);
          default: return '<div class="text-xs text-[#86868B]">Select a task from above.</div>';
        }
      }

      renderStudentFlashcards(hw) {
        const cards = hw.flashcards_data || [];
        const card = cards[this.studentCardIndex] || { hanzi: '合作', pinyin: 'hé zuò', meaning: 'Cooperation' };

        return `
          <div class="p-6 bg-white border border-black/[0.06] rounded-3xl text-center space-y-6 shadow-sm">
            <div>
              <span class="text-xs font-bold text-[#0071E3] uppercase tracking-wider">3D Flashcards</span>
              <h4 class="text-base font-bold text-[#1D1D1F] mt-0.5">Click Card to Flip & Listen</h4>
            </div>

            <div class="perspective-1000 flex justify-center py-2">
              <div onclick="window.app.flipStudentCard('${hw.id}')" 
                class="w-72 h-44 cursor-pointer transform-style-3d transition-transform duration-500 relative select-none ${this.studentCardFlipped ? 'rotate-y-180' : ''}">
                <div class="absolute inset-0 bg-white rounded-3xl border border-black/[0.08] shadow-md flex flex-col items-center justify-center p-6 backface-hidden">
                  <span class="text-4xl font-kaiti font-bold text-[#1D1D1F] tracking-widest">${card.hanzi}</span>
                  <span class="text-[10px] text-[#86868B] mt-2">Click to Reveal Pinyin / Meaning 🔄</span>
                </div>
                <div class="absolute inset-0 bg-[#0071E3] text-white rounded-3xl shadow-md flex flex-col items-center justify-center p-6 backface-hidden rotate-y-180">
                  <span class="text-lg font-bold">${card.pinyin}</span>
                  <p class="text-xs mt-2 text-white/90 font-medium px-2 leading-relaxed">${card.meaning}</p>
                  <button type="button" onclick="event.stopPropagation(); window.app.speakWord('${card.hanzi}')" class="mt-3 px-3 py-1 rounded-full bg-white/20 text-xs font-semibold hover:bg-white/30">🔊 Pronounce</button>
                </div>
              </div>
            </div>

            <div class="flex items-center justify-center space-x-6">
              <button type="button" onclick="window.app.prevStudentCard('${hw.id}')" class="w-8 h-8 rounded-full bg-[#F5F5F7] flex items-center justify-center text-xs">◀</button>
              <span class="text-xs font-mono font-bold text-[#86868B]">${this.studentCardIndex + 1} / ${cards.length}</span>
              <button type="button" onclick="window.app.nextStudentCard('${hw.id}')" class="w-8 h-8 rounded-full bg-[#F5F5F7] flex items-center justify-center text-xs">▶</button>
            </div>
          </div>
        `;
      }

      flipStudentCard(hwId) {
        this.studentCardFlipped = !this.studentCardFlipped;
        const db = this.getDB();
        const hw = db.homeworks.find(h => h.id === hwId);
        const sub = (db.submissions || []).find(s => s.homework_id === hwId && s.student_name.toLowerCase() === this.currentStudent.name.toLowerCase());
        this.renderStudentPillFlowWorkspace(hw, sub);
      }
      nextStudentCard(hwId) {
        const db = this.getDB();
        const hw = db.homeworks.find(h => h.id === hwId);
        this.studentCardFlipped = false;
        this.studentCardIndex = (this.studentCardIndex + 1) % (hw.flashcards_data?.length || 1);
        const sub = (db.submissions || []).find(s => s.homework_id === hwId && s.student_name.toLowerCase() === this.currentStudent.name.toLowerCase());
        this.renderStudentPillFlowWorkspace(hw, sub);
      }
      prevStudentCard(hwId) {
        const db = this.getDB();
        const hw = db.homeworks.find(h => h.id === hwId);
        const total = hw.flashcards_data?.length || 1;
        this.studentCardFlipped = false;
        this.studentCardIndex = (this.studentCardIndex - 1 + total) % total;
        const sub = (db.submissions || []).find(s => s.homework_id === hwId && s.student_name.toLowerCase() === this.currentStudent.name.toLowerCase());
        this.renderStudentPillFlowWorkspace(hw, sub);
      }

      renderStudentTracing(hw, sub) {
        const feedbackImages = sub?.tracing_feedback_images || (sub?.tracing_feedback_image ? [sub.tracing_feedback_image] : []);
        const chars = (hw.hanzi_list || '').split('');

        if (feedbackImages.length > 0) {
          const pageSize = 3;
          const totalPages = Math.ceil(feedbackImages.length / pageSize);
          const startIndex = (this.studentReviewCharPage - 1) * pageSize;
          const currentFeedbacks = feedbackImages.slice(startIndex, startIndex + pageSize);

          return `
            <div class="p-6 bg-white border border-black/[0.06] rounded-3xl shadow-sm space-y-5">
              <div class="flex items-center justify-between">
                <div>
                  <h4 class="text-xs font-bold text-[#E02020] uppercase tracking-wider flex items-center space-x-1.5">
                    <span>🖊️ Teacher's Annotated Feedback (3 列并排复盘)</span>
                  </h4>
                  <p class="text-[11px] text-[#86868B]">Reviewed with calligraphy seal stamps & stroke corrections</p>
                </div>
                <span class="text-xs text-[#0071E3] font-semibold">Total ${feedbackImages.length} characters</span>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                ${currentFeedbacks.map((imgUrl, i) => `
                  <div class="p-4 bg-[#F5F5F7] rounded-2xl flex flex-col items-center space-y-2 border border-black/[0.04]">
                    <span class="text-xs font-bold text-[#1D1D1F]">Character #${startIndex + i + 1}</span>
                    <img src="${imgUrl}" class="w-44 h-44 rounded-xl border bg-white object-contain shadow-sm" />
                  </div>

              </div>

              ${totalPages > 1 ? `
                <div class="pt-3 border-t flex items-center justify-between text-xs">
                  <button type="button" onclick="window.app.stepStudentReviewCharPage('${hw.id}', -1)" ${this.studentReviewCharPage <= 1 ? 'disabled class="text-black/20"' : 'class="font-semibold text-[#0071E3]"'}>
                    ◀ Previous
                  </button>
                  <span class="text-[#86868B] font-mono">Page ${this.studentReviewCharPage} / ${totalPages}</span>
                  <button type="button" onclick="window.app.stepStudentReviewCharPage('${hw.id}', 1)" ${this.studentReviewCharPage >= totalPages ? 'disabled class="text-black/20"' : 'class="font-semibold text-[#0071E3]"'}>
                    Next ▶
                  </button>
                </div>
              ` : ''}

        }

        return `
          <div class="space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
              ${chars.map((char, idx) => `
                <div class="p-5 bg-white border border-black/[0.06] rounded-3xl shadow-sm space-y-3">
                  <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                      <span class="text-lg font-bold text-[#0071E3] font-mono">${this.getPinyin(char)}</span>
                      <button type="button" onclick="window.app.speakWord('${char}')" class="p-1 rounded-lg bg-[#F5F5F7] text-xs hover:bg-[#E8E8ED]">🔊</button>
                    </div>
                    <button type="button" onclick="window.app.animateHanziStroke(${idx})" class="px-2.5 py-1 bg-[#0071E3]/10 text-[#0071E3] font-semibold text-xs rounded-lg hover:bg-[#0071E3]/20">
                      ▶ Stroke Order
                    </button>
                  </div>

                  <div class="flex flex-col sm:flex-row items-center gap-4">
                    <div id="hanzi-anim-${idx}" class="w-28 h-28 bg-[#F5F5F7] rounded-2xl border flex items-center justify-center shrink-0"></div>
                    <div class="relative">
                      <canvas id="hanzi-canvas-${idx}" width="200" height="200" class="drawing-canvas rounded-2xl border bg-white shadow-sm"></canvas>
                      <div class="flex justify-between items-center mt-1 px-1">
                        <button type="button" onclick="window.app.undoStroke(${idx})" class="text-[11px] text-[#86868B] hover:text-[#0071E3]">Undo ↶</button>
                        <button type="button" onclick="window.app.clearCanvas(${idx})" class="text-[11px] text-[#86868B] hover:text-[#FF3B30]">Clear ✕</button>
                      </div>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      stepStudentReviewCharPage(hwId, delta) {
        this.studentReviewCharPage += delta;
        const db = this.getDB();
        const hw = db.homeworks.find(h => h.id === hwId);
        const sub = (db.submissions || []).find(s => s.homework_id === hwId && s.student_name.toLowerCase() === this.currentStudent.name.toLowerCase());
        this.renderStudentPillFlowWorkspace(hw, sub);
      }

      renderStudentUnscramble(hw, sub) {
        return `
          <div class="p-6 bg-white border border-black/[0.06] rounded-3xl shadow-sm space-y-5">
            <div>
              <span class="text-xs font-bold text-[#0071E3] uppercase tracking-wider">Syntax & Word Order</span>
              <h4 class="text-base font-bold text-[#1D1D1F] mt-0.5">Reorder tokens into a correct sentence:</h4>
            </div>

            <div class="p-4 bg-[#F5F5F7] rounded-2xl min-h-[60px] flex flex-wrap gap-2 items-center border border-dashed border-black/[0.1]">
              ${this.unscrambleUserTokens.length === 0 ? '<span class="text-xs text-[#86868B] italic">Click words below to place here...</span>' : ''}
              ${this.unscrambleUserTokens.map((tok, i) => `
                <button type="button" onclick="window.app.returnUnscrambleToken(${i}, '${hw.id}')" 
                  class="px-3.5 py-1.5 bg-[#0071E3] text-white font-medium text-xs rounded-xl shadow-sm hover:bg-[#0077ED] transition-all">
                  ${tok} ✕
                </button>
              `).join('')}
            </div>

            <div>
              <span class="block text-[11px] font-semibold text-[#86868B] mb-2">Available Tokens (Click to dock):</span>
              <div class="flex flex-wrap gap-2">
                ${this.unscramblePool.map((tok, i) => `
                  <button type="button" onclick="window.app.dockUnscrambleToken(${i}, '${hw.id}')" 
                    class="px-3.5 py-1.5 bg-white border border-black/[0.1] text-xs font-medium text-[#1D1D1F] rounded-xl hover:bg-[#F5F5F7] shadow-sm transition-all">
                    ${tok}
                  </button>
                `).join('')}
              </div>

        `;

      dockUnscrambleToken(poolIdx, hwId) {
        const item = this.unscramblePool.splice(poolIdx, 1)[0];
        this.unscrambleUserTokens.push(item);
        const db = this.getDB();
        const hw = db.homeworks.find(h => h.id === hwId);
        const sub = (db.submissions || []).find(s => s.homework_id === hwId && s.student_name.toLowerCase() === this.currentStudent.name.toLowerCase());
        this.renderStudentPillFlowWorkspace(hw, sub);
      }

      returnUnscrambleToken(targetIdx, hwId) {
        const item = this.unscrambleUserTokens.splice(targetIdx, 1)[0];
        this.unscramblePool.push(item);
        const db = this.getDB();
        const hw = db.homeworks.find(h => h.id === hwId);
        const sub = (db.submissions || []).find(s => s.homework_id === hwId && s.student_name.toLowerCase() === this.currentStudent.name.toLowerCase());
        this.renderStudentPillFlowWorkspace(hw, sub);
      }

      renderStudentCloze(hw, sub) {
        const clozeData = hw.cloze_data || {};
        const sentence = clozeData.sentence || '';
        const blanks = clozeData.blanks || [];
        const tokens = sentence.includes(' ') ? sentence.split(/\s+/).filter(Boolean) : sentence.split('');

        return `
          <div class="p-6 bg-white border border-black/[0.06] rounded-3xl shadow-sm space-y-4">
            <div>
              <span class="text-xs font-bold text-[#0071E3] uppercase tracking-wider">Cloze Sentence</span>
              <h4 class="text-base font-bold text-[#1D1D1F] mt-0.5">Type missing characters directly on the lines:</h4>
            </div>

            <div class="p-5 bg-[#F5F5F7] rounded-2xl text-base leading-loose font-medium text-[#1D1D1F]">
              ${tokens.map((token, idx) => {
                if (blanks.includes(token)) {
                  const saved = this.studentDraftAnswers?.cloze[idx] ?? (sub?.cloze_answers ? sub.cloze_answers[idx] || '' : '');
                  return `<input type="text" id="cloze-ans-${idx}" value="${saved}" placeholder="____" class="inline-block mx-1 w-24 px-2 py-0.5 text-center bg-white border-b-2 border-[#0071E3] font-kaiti font-bold text-sm text-[#0071E3] focus:outline-none">`;
                }
                return `<span>${token}</span>`;
              }).join(' ')}
            </div>
          </div>
        `;
      }

      renderStudentTranslation(hw, sub) {
        const list = hw.translation_data || [];
        return `
          <div class="p-6 bg-white border border-black/[0.06] rounded-3xl shadow-sm space-y-4">
            <span class="text-xs font-bold text-[#0071E3] uppercase tracking-wider">Translation & Grammar</span>
            <div class="space-y-4">
              ${list.map((item, idx) => {
                const saved = this.studentDraftAnswers?.translation[item.id] ?? (sub?.translation_answers ? sub.translation_answers[item.id] || '' : '');
                return `
                  <div class="p-4 bg-[#F5F5F7] rounded-2xl space-y-2">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-bold text-[#1D1D1F]">${idx + 1}. ${item.prompt}</span>
                      ${item.hint ? `<span class="text-[10px] bg-[#0071E3]/10 text-[#0071E3] font-bold px-2 py-0.5 rounded-full">💡 Hint: ${item.hint}</span>` : ''}
                    </div>
                    <input type="text" id="trans-ans-${item.id}" value="${saved}" placeholder="Type Chinese translation here..." class="w-full px-3 py-2 bg-white rounded-xl text-xs font-medium border border-black/[0.04] focus:outline-none focus:ring-4 focus:ring-[#0071E3]/15">
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      renderStudentDialogue(hw, sub) {
        const list = hw.dialogue_data || [];
        return `
          <div class="p-6 bg-white border border-black/[0.06] rounded-3xl shadow-sm space-y-4">
            <span class="text-xs font-bold text-[#0071E3] uppercase tracking-wider">Business Chat Simulation</span>
            <div class="p-4 bg-[#F5F5F7] rounded-2xl space-y-4">
              ${list.map(d => {
                const textAns = this.studentDraftAnswers?.dialogueTexts[d.id] ?? (sub?.dialogue_answers?.texts ? sub.dialogue_answers.texts[d.id] || '' : '');
                const hasAudio = this.dialogueAudios[d.id];
                return `
                  <div class="space-y-2">
                    <div class="flex items-start space-x-2">
                      <div class="w-7 h-7 rounded-full bg-black/10 flex items-center justify-center text-[10px] font-bold">A</div>
                      <div class="max-w-[75%] px-4 py-2.5 rounded-2xl bg-white border border-black/[0.06] text-xs font-medium text-[#1D1D1F] shadow-sm">${d.speaker_a}</div>
                    </div>
                    <div class="flex items-start justify-end space-x-2">
                      <div class="max-w-[80%] w-full sm:w-80">
                        ${d.response_type === 'text' ? `
                          <div class="p-1 rounded-2xl bg-[#0071E3]/10">
                            <input type="text" id="dialogue-text-${d.id}" value="${textAns}" placeholder="Reply here in Chinese..." class="w-full px-3 py-2 bg-white rounded-xl text-xs font-medium focus:outline-none">
                          </div>
                        ` : `
                          <div class="p-3 bg-white rounded-2xl border border-[#0071E3]/20 shadow-sm space-y-2">
                            <div class="flex justify-between items-center text-[10px] font-bold text-[#0071E3]">
                              <span>🎤 Voice Audio Reply</span>
                              <span id="diag-rec-status-${d.id}">${hasAudio ? 'Audio Recorded ✓' : 'Not recorded'}</span>
                            </div>
                            ${hasAudio ? `<audio controls class="w-full h-8" src="${hasAudio}"></audio>` : ''}
                            <button type="button" onclick="window.app.toggleDialogueRecord(${d.id})" id="btn-diag-rec-${d.id}" class="w-full py-1.5 bg-[#0071E3] hover:bg-[#0077ED] text-white text-[11px] font-semibold rounded-lg">
                              ${hasAudio ? 'Record Again' : 'Record Voice Answer'}
                            </button>
                          </div>
                        `}
                      </div>
                      <div class="w-7 h-7 rounded-full bg-[#0071E3] text-white flex items-center justify-center text-[10px] font-bold">You</div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      async toggleDialogueRecord(diagId) {
        const btn = document.getElementById(`btn-diag-rec-${diagId}`);
        const status = document.getElementById(`diag-rec-status-${diagId}`);

        if (this.activeDiagRecId === diagId) {
          if (this.mediaRecorder) this.mediaRecorder.stop();
          this.activeDiagRecId = null;
          if (btn) btn.textContent = 'Record Again';
          if (status) status.textContent = 'Audio Recorded ✓';
          return;
        }

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder) {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            // Safari / iOS 录音格式自适应兼容
            let mimeType = 'audio/webm';
            if (!MediaRecorder.isTypeSupported('audio/webm') && MediaRecorder.isTypeSupported('audio/mp4')) {
              mimeType = 'audio/mp4';
            }

            this.mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
            const chunks = [];
            this.mediaRecorder.ondataavailable = e => chunks.push(e.data);
            this.mediaRecorder.onstop = () => {
              const blob = new Blob(chunks, { type: mimeType });
              const reader = new FileReader();
              reader.onloadend = () => {
                this.dialogueAudios[diagId] = reader.result;
                this.showToast('Voice response saved!', 'success');
                const hwId = document.getElementById('apple-modal-overlay').dataset.hwId;
                const db = this.getDB();
                const hw = db.homeworks.find(h => h.id === hwId);
                const sub = (db.submissions || []).find(s => s.homework_id === hwId && s.student_name.toLowerCase() === this.currentStudent.name.toLowerCase());
                this.renderStudentPillFlowWorkspace(hw, sub);
              };
              reader.readAsDataURL(blob);
              stream.getTracks().forEach(t => t.stop());
            };
            this.mediaRecorder.start();
            this.activeDiagRecId = diagId;
            if (btn) btn.textContent = '⏹ Stop Recording';
            if (status) status.textContent = 'Recording in progress...';
            return;
          } catch (e) {}
        }

        this.dialogueAudios[diagId] = this.generateSampleWavBase64();
        this.showToast('Sample audio recorded (Fallback).', 'info');
        const hwId = document.getElementById('apple-modal-overlay').dataset.hwId;
        const db = this.getDB();
        const hw = db.homeworks.find(h => h.id === hwId);
        const sub = (db.submissions || []).find(s => s.homework_id === hwId && s.student_name.toLowerCase() === this.currentStudent.name.toLowerCase());
        this.renderStudentPillFlowWorkspace(hw, sub);
      }

      renderStudentEssay(hw, sub) {
        const essay = hw.essay_data || { min_words: 60, max_words: 120, word_bank: ['合作', '会议', '安排'], template: '' };
        const savedText = (this.studentDraftAnswers?.essay !== undefined && this.studentDraftAnswers?.essay !== '') 
          ? this.studentDraftAnswers.essay 
          : (sub?.essay_answer || essay.template || '');

        return `
          <div class="p-6 bg-white border border-black/[0.06] rounded-3xl shadow-sm space-y-4">

      async startRecording() {
        this.isRecording = true;
        this.recordingSeconds = 0;
        this.renderVoiceWidget();

        this.recordingTimer = setInterval(() => {
          this.recordingSeconds++;
          this.renderVoiceWidget();
        }, 1000);

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder) {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            // Safari / iOS 录音格式自适应兼容
            let mimeType = 'audio/webm';
            if (!MediaRecorder.isTypeSupported('audio/webm') && MediaRecorder.isTypeSupported('audio/mp4')) {
              mimeType = 'audio/mp4';
            }

            this.mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
            const chunks = [];
            this.mediaRecorder.ondataavailable = e => chunks.push(e.data);
            this.mediaRecorder.onstop = () => {
              const blob = new Blob(chunks, { type: mimeType });
              this.rawAudioBlob = blob;
              const reader = new FileReader();
              reader.onloadend = () => {
                this.recordedAudioBase64 = reader.result;
                this.isRecording = false;
                this.renderVoiceWidget();
              };
              reader.readAsDataURL(blob);
              stream.getTracks().forEach(t => t.stop());
            };
            this.mediaRecorder.start();
            return;
          } catch (err) {}
        }

        setTimeout(() => { if (this.isRecording) this.stopRecording(); }, 3000);
      }

      stopRecording() {
        if (this.recordingTimer) { clearInterval(this.recordingTimer); this.recordingTimer = null; }
        if (this.mediaRecorder && this.mediaRecorder.state === 'recording') {
          this.mediaRecorder.stop();
        } else {
          this.recordedAudioBase64 = this.generateSampleWavBase64();
          this.isRecording = false;
          this.renderVoiceWidget();
        }
      }

      rerecordAudio() {
        this.recordedAudioBase64 = null;
        this.rawAudioBlob = null;
        this.renderVoiceWidget();
      }

      generateSampleWavBase64() {
        const sampleRate = 8000;
        const numSamples = sampleRate * 1.5;
        const buffer = new ArrayBuffer(44 + numSamples);
        const view = new DataView(buffer);
        const writeString = (offset, str) => {
          for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
        };
        writeString(0, 'RIFF');
        view.setUint32(4, 36 + numSamples, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate, true);
        view.setUint16(32, 1, true);
        view.setUint16(34, 8, true);
        writeString(36, 'data');
        view.setUint32(40, numSamples, true);
        for (let i = 0; i < numSamples; i++) {
          view.setUint8(44 + i, Math.floor(128 + 100 * Math.sin((i / sampleRate) * 440 * 2 * Math.PI)));
        }
        let binary = '';
        const bytes = new Uint8Array(buffer);
        for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
        return 'data:audio/wav;base64,' + btoa(binary);
      }

      async executeFinalSubmission(hwId) {
        this.collectCurrentModuleInputs();

        const studentName = this.currentStudent.name;

        // 收集手写快照 (优先取活体 canvas，其次取暂存笔迹)

        const chars = (hw.hanzi_list || '').split('');
        for (let i = 0; i < chars.length; i++) {
          let b64 = null;
          if (this.canvasEngines[i]?.canvas) {
            b64 = this.canvasEngines[i].canvas.toDataURL('image/png');
          } else if (this.studentTracingDrafts[i]) {
            b64 = this.studentTracingDrafts[i];
          }

          if (b64) {
            const uploaded = await this.uploadFileToStorage('ebci-homework-attachments', `hanzi_${hwId}_${studentName}_${i}_${Date.now()}.png`, b64, 'image/png');
            snapshots.push(uploaded || b64);
          }
        }

        // 直接读取经过全流程保护的草稿池，规避 DOM 销毁后数据变空的严重 Bug
        const clozeAnswers = this.studentDraftAnswers.cloze || {};
        const transAnswers = this.studentDraftAnswers.translation || {};
        const diagTexts = this.studentDraftAnswers.dialogueTexts || {};
        const essayText = this.studentDraftAnswers.essay || '';

        let finalAudio = this.recordedAudioBase64 || '';
        if (this.rawAudioBlob && sbClient) {
          const cloudUrl = await this.uploadFileToStorage('ebci-student-audio', `audio_${hwId}_${studentName}_${Date.now()}.webm`, this.rawAudioBlob, 'audio/webm');
          if (cloudUrl && cloudUrl.startsWith('http')) finalAudio = cloudUrl;
        }

        let subIndex = (db.submissions || []).findIndex(s => s.homework_id === hwId && s.student_name.toLowerCase() === studentName.toLowerCase());
        const subData = {
          id: subIndex >= 0 ? db.submissions[subIndex].id : 'sub_' + Date.now(),
          homework_id: hwId,
          student_name: studentName,
          class_code: this.currentStudent.class_code,
          hanzi_snapshots: snapshots.length > 0 ? snapshots : (subIndex >= 0 ? db.submissions[subIndex].hanzi_snapshots : []),
          unscramble_answers: this.unscrambleUserTokens,
          cloze_answers: clozeAnswers,
          translation_answers: transAnswers,
          dialogue_answers: { texts: diagTexts, audios: this.dialogueAudios },
          essay_answer: essayText,
          audio_url: finalAudio,
          audio_data: finalAudio,
          tracing_feedback_images: subIndex >= 0 ? db.submissions[subIndex].tracing_feedback_images : [],
          tracing_feedback_image: subIndex >= 0 ? db.submissions[subIndex].tracing_feedback_image : null,
          grade: subIndex >= 0 ? db.submissions[subIndex].grade : '',
          feedback: subIndex >= 0 ? db.submissions[subIndex].feedback : '',
          submitted_at: new Date().toISOString().replace('T', ' ').substring(0, 16),
          graded_at: subIndex >= 0 ? db.submissions[subIndex].graded_at : ''
        };

        await this.syncRecord('submissions', subData);
        this.closeModal();
        this.showToast('All tasks submitted successfully!', 'success');
        this.render();
      }

      async saveTeacher(tId) {
        const name = document.getElementById('modal-tch-name').value.trim();
        const username = document.getElementById('modal-tch-username').value.trim();
        const pwd = document.getElementById('modal-tch-pwd').value.trim();
        const isAdmin = document.getElementById('modal-tch-admin').checked;
        const cls = [];
        document.querySelectorAll('input[name="modal-assign-cls"]:checked').forEach(cb => cls.push(cb.value));

        if (!name || !username || !pwd) return alert('请完整填写');
        const db = this.getDB();

        if (tId) {
          const t = db.teachers.find(x => x.id === tId);
          if (!t) return;
          t.name = name; t.username = username; t.password = pwd; t.is_admin = isAdmin; t.assigned_classes = cls;
          if (this.currentTeacher && this.currentTeacher.id === t.id) this.currentTeacher = { ...t };
          await this.syncRecord('teachers', t);
        } else {
          if ((db.teachers || []).some(x => x.username === username)) return alert('账号已存在');
          const newT = { id: 't_' + Date.now(), username, password: pwd, name, is_admin: isAdmin, assigned_classes: cls };
          await this.syncRecord('teachers', newT);
        }
        this.closeModal();
        this.showToast('教师信息已更新！', 'success');
        this.render();
      }

      async deleteTeacher(id) {
        if (!confirm('确定删除该教师账号吗？')) return;
        const db = this.getDB();
        db.teachers = (db.teachers || []).filter(t => t.id !== id);
        this.saveDB(db);
        if (sbClient) { try { await sbClient.from('teachers').delete().eq('id', id); } catch (e) {} }
        this.showToast('教师账号已注销', 'info');
        this.render();
      }

      async saveNewClass() {
        const name = document.getElementById('new-cls-name').value.trim();
        const code = document.getElementById('new-cls-code').value.trim().toUpperCase();
        if (!name || !code) return alert('请完整填写信息');

        const db = this.getDB();
        const newCls = { id: 'c_' + Date.now(), code, name, teacher_id: this.currentTeacher.id, created_at: new Date().toISOString().substring(0, 10) };
        if (!this.currentTeacher.assigned_classes) this.currentTeacher.assigned_classes = [];
        this.currentTeacher.assigned_classes.push(code);

        await this.syncRecord('classes', newCls);
        await this.syncRecord('teachers', this.currentTeacher);

        this.selectedTeacherClass = code;
        this.closeModal();
        this.showToast(`班级 ${name} 创建成功！`, 'success');
        this.render();

async deleteClass(clsCode, clsName) {
        if (!confirm(`确定要彻底删除班级【${clsName}】(${clsCode}) 吗？\n\n警告：删除后该班级下的所有学生、作业及提交记录将一并彻底移除，无法撤销！`)) {
          return;
        }

        const db = this.getDB();
        db.classes = (db.classes || []).filter(c => c.code !== clsCode);
        db.students = (db.students || []).filter(s => s.class_code !== clsCode);
        db.homeworks = (db.homeworks || []).filter(h => h.class_code !== clsCode);
        db.submissions = (db.submissions || []).filter(s => s.class_code !== clsCode);

        // 清理教师管辖班级列表
        (db.teachers || []).forEach(t => {
          if (t.assigned_classes) {
            t.assigned_classes = t.assigned_classes.filter(c => c !== clsCode);
          }
        });
        if (this.currentTeacher?.assigned_classes) {
          this.currentTeacher.assigned_classes = this.currentTeacher.assigned_classes.filter(c => c !== clsCode);
        }

        this.saveDB(db);

        if (sbClient) {
          try {
            await sbClient.from('submissions').delete().eq('class_code', clsCode);
            await sbClient.from('homeworks').delete().eq('class_code', clsCode);
            await sbClient.from('students').delete().eq('class_code', clsCode);
            await sbClient.from('classes').delete().eq('code', clsCode);
          } catch (e) {}
        }

        // 如果删除的是当前正选中的班级，自动切换至剩余班级
        if (this.selectedTeacherClass === clsCode) {
          const remaining = (db.classes || []).filter(c => this.currentTeacher.is_admin || (this.currentTeacher.assigned_classes || []).includes(c.code));
          this.selectedTeacherClass = remaining[0]?.code || '';
        }

        this.showToast(`班级【${clsName}】已删除`, 'info');
        this.render();
      }

      async studentLogin() {
        this.ensureSeedData();
        const code = (document.getElementById('stu-class-code')?.value || '').trim().toUpperCase();
        const name = (document.getElementById('stu-name')?.value || '').trim();
        const pin = String(document.getElementById('stu-pin')?.value || '').trim();

        if (!code || !name || !pin) return alert('Please fill in all 3 fields.');

        const db = this.getDB();
        let student = (db.students || []).find(s => s.class_code.toUpperCase() === code && s.name.toLowerCase() === name.toLowerCase());
        if (!student) {
          student = { id: 's_' + Date.now(), class_code: code, name, pin_code: pin, created_at: new Date().toISOString().substring(0, 16) };
          await this.syncRecord('students', student);
          this.showToast(`Welcome! Account created for ${name}`, 'success');
        } else if (String(student.pin_code).trim() !== pin) {
          return alert('Incorrect 4-Digit PIN for this student.');
        }

        this.currentStudent = { class_code: code, name: student.name };
        this.render();
      }

                  </div>
                  <span>${this.showArchivedHomeworksStudent ? 'Collapse ▲' : 'Expand ▼'}</span>
                </button>

                ${this.showArchivedHomeworksStudent ? `
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4 animate-fadeIn">
                    ${archivedHomeworks.map(hw => this.renderStudentHomeworkCard(hw, studentSubs, true)).join('')}
                  </div>
                ` : ''}
              </div>
            ` : ''}
          </div>
        `;
      }

      toggleStudentArchivedDrawer() {
        this.showArchivedHomeworksStudent = !this.showArchivedHomeworksStudent;
        this.render();
      }

      renderStudentHomeworkCard(hw, studentSubs, isArchived = false) {
        const sub = studentSubs.find(s => s.homework_id === hw.id);
        const isSubmitted = Boolean(sub);
        const isClosed = hw.status === 'closed';

        return `
          <div class="bg-white rounded-3xl p-6 border ${isClosed ? 'border-black/[0.12] bg-[#FAFAFA]' : 'border-black/[0.06]'} shadow-sm flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-center mb-3">
                <span class="px-3 py-1 rounded-full text-xs font-semibold ${
                  sub?.grade 
                    ? 'bg-[#34C759]/15 text-[#34C759]' 
                    : isSubmitted 
                      ? 'bg-[#0071E3]/10 text-[#0071E3]' 
                      : isClosed 
                        ? 'bg-black/10 text-[#86868B]' 
                        : 'bg-[#FF9500]/10 text-[#FF9500]'
                }">
                  ${sub?.grade ? `● Graded (${sub.grade})` : isSubmitted ? '● Submitted' : isClosed ? '● Closed (已截止)' : '● Pending Submission'}
                </span>
                <span class="text-xs text-[#86868B]">Due: ${(hw.deadline || '').replace('T', ' ')}</span>
              </div>
              <h4 class="text-lg font-bold text-[#1D1D1F] mb-2">${hw.title}</h4>
              ${sub?.feedback ? `<div class="p-3 bg-[#34C759]/5 border border-[#34C759]/20 rounded-xl text-xs text-[#1D1D1F] mb-3 italic">"Teacher: ${sub.feedback}"</div>` : ''}
            </div>

            <div class="pt-2">
              ${isClosed && !isSubmitted ? `
                <button type="button" disabled class="w-full py-3 bg-black/10 text-[#86868B] font-semibold rounded-xl text-sm cursor-not-allowed">
                  Closed (已截止，不可作答)
                </button>
              ` : `
                <button type="button" onclick="window.app.openStudentHomeworkModal('${hw.id}')" class="w-full py-3 bg-[#0071E3] hover:bg-[#0077ED] text-white font-semibold rounded-xl text-sm shadow-md transition-all">
                  ${isSubmitted ? 'View / Review Submission ➔' : 'Open Assignment ➔'}
                </button>
              `}
            </div>
          </div>
        `;
      }

      renderTeacherLoginView() {
        return `
          <div class="min-h-[75vh] flex items-center justify-center py-10">
            <div class="w-full max-w-md bg-white/80 backdrop-blur-xl border border-black/[0.06] rounded-3xl p-8 sm:p-10 shadow-sm">
              <div class="text-center mb-8">
                <div class="inline-flex w-14 h-14 rounded-2xl bg-[#0071E3]/10 text-[#0071E3] items-center justify-center mb-4">
                  <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                </div>
                <h2 class="text-2xl font-bold tracking-tight text-[#1D1D1F]">教师与管理员登录</h2>
                <p class="text-sm text-[#86868B] mt-1.5">欧洲商务孔子学院教务后台</p>
              </div>

              <div class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold text-[#86868B] uppercase mb-1.5 ml-1">教师账号</label>
                  <input type="text" id="tch-username" placeholder="请输入教师账号" class="w-full px-4 py-3 bg-[#F5F5F7] border border-black/[0.06] rounded-xl text-sm font-medium focus:outline-none focus:ring-4 focus:ring-[#0071E3]/15">
                </div>
                <div>
                  <label class="block text-xs font-semibold text-[#86868B] uppercase mb-1.5 ml-1">登录密码</label>
                  <input type="password" id="tch-password" placeholder="请输入密码" class="w-full px-4 py-3 bg-[#F5F5F7] border border-black/[0.06] rounded-xl text-sm font-medium focus:outline-none focus:ring-4 focus:ring-[#0071E3]/15">
                </div>
                <button type="button" id="btn-tch-login" onclick="window.app.teacherLogin()" class="w-full py-3.5 bg-[#0071E3] hover:bg-[#0077ED] text-white font-semibold rounded-xl text-sm shadow-md transition-all">
                  进入教务后台
                </button>
              </div>
            </div>
          </div>
        `;
      }

      async teacherLogin() {
        this.ensureSeedData();
        const u = (document.getElementById('tch-username')?.value || '').trim();
        const p = (document.getElementById('tch-password')?.value || '').trim();

        if (!u || !p) return alert('请输入账号与密码。');

        let db = this.getDB();
        let teacher = (db.teachers || []).find(t => t.username === u && t.password === p);

        if (!teacher && sbClient) {
          try {
            const { data } = await sbClient.from('teachers').select('*').eq('username', u).eq('password', p).maybeSingle();
            if (data) {
              teacher = data;
              const idx = (db.teachers || []).findIndex(t => t.id === data.id);
              if (idx >= 0) db.teachers[idx] = data;
              else db.teachers.push(data);
              this.saveDB(db);
            }
          } catch (e) {}
        }

        if (!teacher) return alert('账号或密码错误，请重试。');

        this.currentTeacher = teacher;
        const allowedClasses = teacher.is_admin ? (db.classes || []).map(c => c.code) : (teacher.assigned_classes || []);
        this.selectedTeacherClass = allowedClasses[0] || db.classes[0]?.code || 'HSK1-A';
        this.teacherViewTab = 'homeworks';
        this.render();
      }

      teacherLogout() { 
        this.currentTeacher = null; 
        this.render(); 
      }
    }

    /**
     * =========================================================================
     * 全局双向挂载与生命周期入口（彻底消除 Runtime 与 HTML onclick 解析错误）
     * =========================================================================
     */
    window.addEventListener('DOMContentLoaded', () => {
      window.app = new EBCIApp();

      // 双向挂载快捷访问入口
      window.openStudentHomeworkModal = (id) => window.app.openStudentHomeworkModal(id);
      window.openGradeModal = (id) => window.app.openGradeModal(id);
      window.exportStudentReportPDF = (id) => window.app.exportStudentReportPDF(id);
      window.exportClassHomeworkSetPDF = (id) => window.app.exportClassHomeworkSetPDF(id);
      window.deleteHomework = (id) => window.app.deleteHomework(id);
      window.toggleHomeworkStatus = (id) => window.app.toggleHomeworkStatus(id);
    });
  </script>
</body>
